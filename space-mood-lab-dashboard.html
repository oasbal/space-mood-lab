<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Mood Lab — 교수용 대시보드</title>
<style>
:root {
  --bg: #f5f3ef;
  --card-bg: #ffffff;
  --ink: #2d2d2d;
  --sage: #2d4a3e;
  --sage-light: rgba(45,74,62,0.08);
  --line: #e0ddd8;
  --accent: #d4a574;
  --radius: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding: 24px;
}
header {
  text-align: center;
  margin-bottom: 32px;
}
header h1 {
  font-size: 28px;
  font-weight: 800;
  color: var(--sage);
}
header p {
  font-size: 14px;
  color: #888;
  margin-top: 6px;
}
.controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 24px;
}
.controls button {
  padding: 10px 20px;
  border: 1.5px solid var(--sage);
  border-radius: 10px;
  background: #fff;
  color: var(--sage);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
}
.controls button:hover, .controls button.active {
  background: var(--sage);
  color: #fff;
}
.status-bar {
  text-align: center;
  margin-bottom: 20px;
  font-size: 14px;
  color: #888;
}
.status-bar .count {
  font-weight: 700;
  color: var(--sage);
  font-size: 18px;
}

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
  max-width: 1400px;
  margin: 0 auto;
}

/* Card */
.team-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
  border: 2px solid transparent;
}
.team-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  border-color: var(--sage);
}
.team-card .team-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.team-card .team-name {
  font-size: 20px;
  font-weight: 800;
  color: var(--sage);
}
.team-card .team-time {
  font-size: 12px;
  color: #aaa;
}
.team-card .team-client {
  font-size: 13px;
  color: #666;
  margin-bottom: 8px;
  padding: 6px 10px;
  background: var(--sage-light);
  border-radius: 8px;
  display: inline-block;
}
.team-card .team-concept {
  font-size: 15px;
  font-weight: 600;
  margin: 10px 0;
  color: var(--ink);
}
.team-card .team-keywords {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.team-card .kw-tag {
  padding: 4px 10px;
  background: var(--sage-light);
  border-radius: 20px;
  font-size: 12px;
  color: var(--sage);
  font-weight: 500;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: #aaa;
}
.empty-state .emoji { font-size: 48px; margin-bottom: 16px; }
.empty-state p { font-size: 16px; }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 36px;
  max-width: 720px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  position: relative;
}
.modal-close {
  position: absolute;
  top: 16px;
  right: 20px;
  font-size: 28px;
  cursor: pointer;
  color: #aaa;
  background: none;
  border: none;
  line-height: 1;
}
.modal-close:hover { color: var(--ink); }
.modal h2 {
  font-size: 24px;
  font-weight: 800;
  color: var(--sage);
  margin-bottom: 20px;
}
.modal .detail-row {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
  align-items: baseline;
}
.modal .detail-label {
  min-width: 90px;
  font-size: 13px;
  font-weight: 600;
  color: #888;
}
.modal .detail-value {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.5;
}
.modal .prompt-box {
  margin-top: 16px;
  padding: 16px;
  background: #1a1a2e;
  color: #e0e0e0;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.6;
  word-break: break-all;
}
.modal .present-section {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}
.modal .present-section h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--sage);
  margin-bottom: 12px;
}

/* URL input */
.url-setup {
  max-width: 600px;
  margin: 0 auto 32px;
  display: flex;
  gap: 10px;
}
.url-setup input {
  flex: 1;
  padding: 12px 16px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
}
.url-setup input:focus {
  outline: none;
  border-color: var(--sage);
}
.url-setup button {
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  background: var(--sage);
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  font-size: 14px;
  white-space: nowrap;
}
</style>
</head>
<body>

<header>
  <h1>🪐 Space Mood Lab — 발표 대시보드</h1>
  <p>실시간으로 팀 제출 현황을 확인합니다</p>
</header>

<div class="url-setup" id="urlSetup">
  <input type="text" id="urlInput" placeholder="Google Apps Script 웹 앱 URL을 붙여넣으세요">
  <button onclick="saveUrl()">연결</button>
</div>

<div class="controls">
  <button onclick="loadData()" class="active" id="refreshBtn">🔄 새로고침</button>
  <button onclick="toggleAuto()" id="autoBtn">⏱ 자동 갱신 OFF</button>
</div>

<div class="status-bar" id="statusBar">
  제출된 팀: <span class="count" id="teamCount">0</span>개
  <span id="lastUpdate"></span>
</div>

<div class="grid" id="teamGrid"></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent"></div>
</div>

<script>
let SCRIPT_URL = localStorage.getItem('spacelab_url') || '';
let teams = [];
let autoInterval = null;

// Init
window.addEventListener('DOMContentLoaded', () => {
  if (SCRIPT_URL) {
    document.getElementById('urlInput').value = SCRIPT_URL;
    document.getElementById('urlSetup').style.display = 'none';
    loadData();
  }
});

function saveUrl() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return;
  SCRIPT_URL = url;
  localStorage.setItem('spacelab_url', url);
  document.getElementById('urlSetup').style.display = 'none';
  loadData();
}

function loadData() {
  if (!SCRIPT_URL) {
    document.getElementById('urlSetup').style.display = 'flex';
    return;
  }
  const btn = document.getElementById('refreshBtn');
  btn.textContent = '⏳ 불러오는 중...';

  fetch(SCRIPT_URL)
    .then(r => r.json())
    .then(data => {
      if (data.status === 'ok') {
        teams = data.teams || [];
        renderGrid();
        document.getElementById('teamCount').textContent = teams.length;
        document.getElementById('lastUpdate').textContent = ` · 마지막 갱신: ${new Date().toLocaleTimeString('ko-KR')}`;
      }
      btn.textContent = '🔄 새로고침';
    })
    .catch(err => {
      btn.textContent = '🔄 새로고침';
      document.getElementById('statusBar').innerHTML += ' <span style="color:#e74c3c">⚠️ 불러오기 실패</span>';
    });
}

function toggleAuto() {
  const btn = document.getElementById('autoBtn');
  if (autoInterval) {
    clearInterval(autoInterval);
    autoInterval = null;
    btn.textContent = '⏱ 자동 갱신 OFF';
    btn.classList.remove('active');
  } else {
    autoInterval = setInterval(loadData, 10000); // 10초마다
    btn.textContent = '⏱ 자동 갱신 ON (10초)';
    btn.classList.add('active');
  }
}

function renderGrid() {
  const grid = document.getElementById('teamGrid');
  if (teams.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="emoji">🚀</div><p>아직 제출된 팀이 없습니다.<br>학생들이 제출하면 여기에 나타납니다!</p></div>`;
    return;
  }

  grid.innerHTML = teams.map((t, i) => {
    const keywords = [t['스타일'], t['무드'], t['조명'], t['소재'], t['색상'], t['가구'], t['소품']].filter(Boolean);
    return `
      <div class="team-card" onclick="openModal(${i})">
        <div class="team-header">
          <span class="team-name">${t['팀이름'] || '이름없음'}</span>
          <span class="team-time">${t['제출시간'] || ''}</span>
        </div>
        <div class="team-client">👤 ${t['클라이언트'] || '-'}</div>
        ${t['이미지'] && t['이미지'].startsWith('data:') ? `<img src="${t['이미지']}" alt="결과" style="width:100%;border-radius:10px;margin:8px 0;max-height:180px;object-fit:cover;">` : ''}
        <div class="team-concept">"${t['컨셉'] || '(미입력)'}"</div>
        <div class="team-keywords">${keywords.map(k => `<span class="kw-tag">${k}</span>`).join('')}</div>
      </div>
    `;
  }).join('');
}

function openModal(idx) {
  const t = teams[idx];
  const keywords = [t['스타일'], t['무드'], t['조명'], t['소재'], t['색상'], t['가구'], t['소품']].filter(Boolean);

  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('show')">&times;</button>
    <h2>${t['팀이름'] || '이름없음'}</h2>
    <div class="detail-row"><div class="detail-label">클라이언트</div><div class="detail-value">${t['클라이언트'] || '-'}</div></div>
    <div class="detail-row"><div class="detail-label">공간</div><div class="detail-value">${t['공간'] || '-'}</div></div>
    <div class="detail-row"><div class="detail-label">디자인 컨셉</div><div class="detail-value">${t['컨셉'] || '-'}</div></div>
    <div class="detail-row"><div class="detail-label">핵심가치</div><div class="detail-value">${t['핵심가치'] || '-'}</div></div>
    <div class="detail-row"><div class="detail-label">해결과제</div><div class="detail-value">${t['해결과제'] || '-'}</div></div>
    <div class="detail-row"><div class="detail-label">목표분위기</div><div class="detail-value">${t['목표분위기'] || '-'}</div></div>
    <div class="detail-row"><div class="detail-label">키워드</div><div class="detail-value">${keywords.join(', ') || '-'}</div></div>
    ${t['이미지'] && t['이미지'].startsWith('data:') ? `<img src="${t['이미지']}" alt="결과 이미지" style="width:100%;border-radius:12px;margin:16px 0;max-height:400px;object-fit:contain;">` : ''}
    <div class="prompt-box">${t['프롬프트'] || '(프롬프트 없음)'}</div>
    <div class="present-section">
      <h3>📋 발표 내용</h3>
      <div class="detail-row"><div class="detail-label">니즈 파악</div><div class="detail-value">${t['발표1_니즈파악'] || '-'}</div></div>
      <div class="detail-row"><div class="detail-label">필수 조건</div><div class="detail-value">${t['발표2_필수조건'] || '-'}</div></div>
      <div class="detail-row"><div class="detail-label">기대 효과</div><div class="detail-value">${t['발표3_기대효과'] || '-'}</div></div>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('show');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('show');
});
</script>
</body>
</html>
