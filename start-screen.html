<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 공간 디렉터 — 시작 화면</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a1a1a;
  --paper: #f4efe8;
  --paper-2: #ebe4d8;
  --paper-3: #e0d6c4;
  --muted: #8a8275;
  --accent: #c8462c;
  --accent-2: #2d4a3e;
  --accent-3: #d4a574;
  --serif: "Fraunces", "Noto Serif KR", ui-serif, Georgia, serif;
  --sans: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  background: var(--paper);
  font-family: var(--sans);
  color: var(--ink);
  overflow: hidden;
}

.screen {
  width: 100vw; height: 100vh;
  display: flex;
  position: relative;
}

/* Frame border */
.frame {
  position: absolute;
  inset: 40px 48px;
  border: 1px solid var(--ink);
  pointer-events: none;
  z-index: 10;
}

/* Left: main content */
.left {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 100px 80px 100px 100px;
  position: relative;
}

/* Right: visual panel */
.right {
  width: 42%;
  position: relative;
  overflow: hidden;
}

.right-bg {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(135deg, var(--paper-3) 0%, var(--accent-3) 40%, var(--accent) 100%);
  opacity: 0.15;
}

/* Decorative grid lines */
.right::before {
  content: '';
  position: absolute;
  inset: 80px 60px;
  border: 1px solid rgba(26,26,26,0.08);
  z-index: 1;
}

/* Floating room illustrations */
.room-grid {
  position: absolute;
  inset: 100px 70px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 20px;
  z-index: 2;
}

.room-cell {
  border: 1px solid rgba(26,26,26,0.06);
  background: rgba(244,239,232,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.room-cell img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.7;
  transition: opacity 2s;
}

.room-cell .room-label {
  position: absolute;
  bottom: 12px;
  left: 14px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--muted);
  background: rgba(244,239,232,0.85);
  padding: 3px 8px;
  border-radius: 3px;
}

/* Floating abstract SVG shapes */
.float-shape {
  position: absolute;
  z-index: 1;
  opacity: 0.06;
}

/* Content */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 32px;
}

.badge::before {
  content: '';
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
}

.title-area {
  margin-bottom: 48px;
}

.title-main {
  font-family: var(--sans);
  font-weight: 800;
  font-size: 72px;
  line-height: 1.15;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 12px;
}

.title-main .em {
  color: var(--accent);
  font-style: normal;
}

.title-sub {
  font-family: var(--serif);
  font-weight: 300;
  font-size: 42px;
  font-style: italic;
  color: var(--muted);
  margin-top: 8px;
}

.divider {
  width: 64px;
  height: 2px;
  background: var(--ink);
  margin-bottom: 40px;
}

/* Info rows */
.info-grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 48px;
}

.info-row {
  display: flex;
  align-items: baseline;
  gap: 16px;
}

.info-label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  min-width: 100px;
}

.info-value {
  font-size: 20px;
  font-weight: 500;
  color: var(--ink);
}

/* Department badge */
.dept-badge {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 14px 28px;
  border: 1.5px solid var(--accent-2);
  border-radius: 12px;
  background: rgba(45,74,62,0.04);
}

.dept-badge .dept-logo {
  font-size: 24px;
}

.dept-badge .dept-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.dept-badge .dept-univ {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}

.dept-badge .dept-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent-2);
}

/* Bottom bar */
.bottom-bar {
  position: absolute;
  bottom: 56px;
  left: 100px;
  right: 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}

.bottom-hint {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--muted);
  animation: pulse 2.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

.bottom-page {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--muted);
}

/* Ambient animation */
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.room-cell:nth-child(1) { animation: float 6s ease-in-out infinite; }
.room-cell:nth-child(2) { animation: float 6s ease-in-out 1.5s infinite; }
.room-cell:nth-child(3) { animation: float 6s ease-in-out 3s infinite; }
.room-cell:nth-child(4) { animation: float 6s ease-in-out 4.5s infinite; }

/* Number watermark */
.watermark {
  position: absolute;
  right: -30px;
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--serif);
  font-weight: 300;
  font-style: italic;
  font-size: 400px;
  line-height: 0.8;
  color: var(--ink);
  opacity: 0.03;
  z-index: 0;
  pointer-events: none;
}

/* Responsive for smaller screens */
@media (max-width: 1400px) {
  .title-main { font-size: 56px; }
  .title-sub { font-size: 32px; }
  .left { padding: 80px 60px 80px 80px; }
}
</style>
</head>
<body>

<div class="screen">
  <div class="frame"></div>

  <!-- Left content -->
  <div class="left">
    <div class="badge">2026년 RISE 직무체험프로그램</div>

    <div class="title-area">
      <div class="title-main">
        단어가 공간을<br><span class="em">만든다.</span>
      </div>
      <div class="title-sub">AI 공간디렉터</div>
    </div>

    <div class="divider"></div>

    <div class="info-grid">
      <div class="info-row">
        <span class="info-label">Date</span>
        <span class="info-value">2026. 5. 18 (월)</span>
      </div>
      <div class="info-row">
        <span class="info-label">For</span>
        <span class="info-value">김해건설공고</span>
      </div>
      <div class="info-row">
        <span class="info-label">Duration</span>
        <span class="info-value">100분 (강의 20′ + 실습 60′ + 마무리 20′)</span>
      </div>
    </div>

    <div class="dept-badge">
      <div class="dept-logo">🏛️</div>
      <div class="dept-text">
        <span class="dept-univ">Kyungnam College of Information & Technology</span>
        <span class="dept-name">경남정보대학교 인테리어디자인과</span>
      </div>
    </div>

    <div class="watermark">01</div>
  </div>

  <!-- Right visual panel -->
  <div class="right">
    <div class="right-bg"></div>

    <div class="room-grid">
      <div class="room-cell">
        <img src="images/oneroom.png" alt="원룸" onerror="this.style.display='none'">
        <div class="room-label">ONEROOM</div>
      </div>
      <div class="room-cell">
        <img src="images/living.png" alt="거실" onerror="this.style.display='none'">
        <div class="room-label">LIVING</div>
      </div>
      <div class="room-cell">
        <img src="images/studio.png" alt="작업실" onerror="this.style.display='none'">
        <div class="room-label">STUDIO</div>
      </div>
      <div class="room-cell">
        <img src="images/cafe.png" alt="카페" onerror="this.style.display='none'">
        <div class="room-label">CAFE</div>
      </div>
    </div>

    <!-- Decorative SVG shapes -->
    <svg class="float-shape" style="top:60px; right:40px; width:200px;" viewBox="0 0 200 200" fill="none" stroke="var(--ink)" stroke-width="0.5">
      <circle cx="100" cy="100" r="80"/>
      <circle cx="100" cy="100" r="40"/>
      <line x1="100" y1="20" x2="100" y2="180"/>
      <line x1="20" y1="100" x2="180" y2="100"/>
    </svg>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <div class="bottom-hint">곧 시작합니다 ···</div>
    <div class="bottom-page">AI SPACE DIRECTOR · 2026</div>
  </div>
</div>

</body>
</html>
